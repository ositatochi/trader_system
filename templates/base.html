<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00a86b">
  <title>Trader - NGX + Crypto Analysis</title>
  <script>
    (() => {
      let theme = "dark";
      try { theme = localStorage.getItem("trader-theme") || "dark"; } catch (_) {}
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
    })();
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    <div class="brand"><a href="/">Trader</a></div>
    <nav>
      <a href="/">Home</a>
      <a href="/assets">Assets</a>
      <a href="/signals">Signals</a>
      <a href="/diagnostics">Diagnostics</a>
      <form action="/refresh" method="POST" class="refresh-form">
        <button type="submit" class="btn primary small">Refresh</button>
      </form>
    </nav>
  </div>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
