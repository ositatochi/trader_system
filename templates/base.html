<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#00a86b">
  <title>Trader - NGX + Crypto Analysis</title>
  <script>
    (() => {
      let theme = "dark";
      try { theme = localStorage.getItem("trader-theme") || "dark"; } catch (_) {}
      document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
    })();
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="topbar">
    <div class="brand"><a href="/">Trader</a></div>
    <nav>
      <a href="/" aria-label="Home"><span class="nav-icon" aria-hidden="true">⌂</span><span class="nav-label">Home</span></a>
      <a href="/assets" aria-label="Assets"><span class="nav-icon" aria-hidden="true">▦</span><span class="nav-label">Assets</span></a>
      <a href="/signals" aria-label="Signals"><span class="nav-icon" aria-hidden="true">↗</span><span class="nav-label">Signals</span></a>
      <a href="/diagnostics" aria-label="Diagnostics"><span class="nav-icon" aria-hidden="true">◉</span><span class="nav-label">Diagnostics</span></a>
    </nav>
    <div class="topbar-actions">
      <form action="/refresh" method="POST" class="refresh-form">
        <button type="submit" class="btn primary small" aria-label="Refresh data"><span class="action-icon" aria-hidden="true">↻</span><span class="action-label">Refresh</span></button>
      </form>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>
  </div>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
